<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Carosello 3/3 · stella.casa</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0;padding:0}
  .artboard{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--vino);color:var(--crema);font-family:var(--font-testo)}
  .pad{position:absolute;inset:0;padding:72px 76px;display:flex;flex-direction:column;justify-content:space-between}
  .top-row{display:flex;align-items:center;justify-content:space-between}
  .top-row img{width:44px;height:44px;object-fit:contain;filter:brightness(0) invert(1)}
  .index{font-size:20px;font-weight:700;letter-spacing:.08em}
  .index span{opacity:.55}
  .eyebrow{font-size:22px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin:0 0 26px;color:var(--pesca)}
  h1{font-family:var(--font-titoli);font-weight:600;letter-spacing:-.045em;line-height:.99;font-size:76px;margin:0 0 34px;max-width:10ch}
  .sub{font-size:26px;line-height:1.55;max-width:28ch;margin:0 0 46px;opacity:.92}
  .cta{display:inline-flex;align-items:center;gap:14px;background:var(--corallo);color:var(--prugna);font-weight:700;font-size:24px;padding:20px 32px;border-radius:999px}
</style>
</head>
<body>
  <div class="artboard">
    <div class="pad">
      <div class="top-row">
        <img src="../assets/simbolo-crema.svg" alt="stella.casa">
        <p class="index"><span>3</span> / 3</p>
      </div>
      <div>
        <p class="eyebrow">Il passo successivo</p>
        <h1>Leggi la guida completa.</h1>
        <p class="sub">Come leggere un preventivo di gestione, voce per voce, senza sorprese.</p>
        <span class="cta">Leggi la guida su stella.casa/diario</span>
      </div>
    </div>
  </div>
</body>
</html>
