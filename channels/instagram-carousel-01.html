<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Carosello 1/3 · stella.casa</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0;padding:0}
  .artboard{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--corallo);color:var(--prugna);font-family:var(--font-testo)}
  .pad{position:absolute;inset:0;padding:72px 76px;display:flex;flex-direction:column;justify-content:space-between}
  .top-row{display:flex;align-items:center;justify-content:space-between}
  .top-row img{width:44px;height:44px;object-fit:contain}
  .index{font-size:20px;font-weight:700;letter-spacing:.08em}
  .index span{opacity:.55}
  .eyebrow{font-size:22px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin:0 0 26px}
  h1{font-family:var(--font-titoli);font-weight:600;letter-spacing:-.045em;line-height:.99;font-size:92px;margin:0;max-width:9ch}
  .sub{font-size:26px;line-height:1.5;max-width:26ch;margin:34px 0 0}
</style>
</head>
<body>
  <div class="artboard">
    <div class="pad">
      <div class="top-row">
        <img src="../assets/simbolo-prugna.svg" alt="stella.casa">
        <p class="index"><span>1</span> / 3</p>
      </div>
      <div>
        <p class="eyebrow">Una proposta chiara</p>
        <h1>Un preventivo da leggere.</h1>
        <p class="sub">Cosa dovresti trovare scritto, prima di firmare un affidamento.</p>
      </div>
    </div>
  </div>
</body>
</html>
