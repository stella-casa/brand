<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Firma email · stella.casa</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0;padding:0}
  .artboard{width:600px;height:220px;position:relative;overflow:hidden;background:#fff;color:var(--prugna);font-family:var(--font-testo);display:flex;align-items:center;padding:0 32px;box-sizing:border-box}
  .logo{width:210px;height:auto;object-fit:contain;flex:none;margin-right:28px}
  .rule{width:1px;align-self:stretch;margin:14px 0;background:rgba(81,27,54,.25);flex:none}
  .info{padding-left:28px;display:flex;flex-direction:column;gap:6px}
  .name{font-family:var(--font-titoli);font-weight:600;letter-spacing:-.03em;font-size:22px;color:var(--vino);margin:0}
  .role{font-size:14px;color:var(--prugna);opacity:.75;margin:0 0 4px}
  .line{font-size:13px;color:var(--prugna);margin:0}
  .line b{color:var(--corallo)}
</style>
</head>
<body>
  <div class="artboard">
    <img class="logo" src="../assets/firma-vino.svg" alt="stella.casa">
    <div class="rule"></div>
    <div class="info">
      <p class="name">Nome Cognome <span style="font-weight:400;opacity:.7">(esempio)</span></p>
      <p class="role">Gestione case · stella.casa</p>
      <p class="line"><b>T</b> 000 000 0000 · <b>M</b> nome@stella.casa (esempio)</p>
      <p class="line">stella.casa · gestione case a Imperia</p>
    </div>
  </div>
</body>
</html>
